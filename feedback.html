<main class="wrap feature-main"><section class="feature-section"><span class="section-kicker">COMMUNITY</span>
<h1>Манга хүсэлт, алдаа мэдээлэх</h1>
<p class="feature-muted">Орчуулахыг хүссэн манга эсвэл унших явцад гарсан алдааг админд мэдэгдээрэй. Нэвтэрсэн хэрэглэгч хүсэлт илгээх боломжтой.</p>
<div id="feedbackNotice" role="status" aria-live="polite">Нэвтрэлт шалгаж байна…</div>
<form id="feedbackForm" class="feature-form" hidden>
<label for="feedbackKind">Хүсэлтийн төрөл</label><select id="feedbackKind">
<option value="manga_request">Шинэ манга орчуулах хүсэлт</option><option value="page_report">Зураг/орчуулгын алдаа</option></select>
<label for="feedbackTitle">Манганы нэр</label><input id="feedbackTitle" maxlength="160" placeholder="Манганы нэр">
<label for="feedbackManga">Манганы ID (мэдэж байвал)</label><input id="feedbackManga" maxlength="120" placeholder="manga-id">
<div class="feedback-chapter"><label for="feedbackChapter">Бүлэг</label><input id="feedbackChapter" maxlength="32" placeholder="1"></div>
<div class="feedback-chapter"><label for="feedbackPage">Алдаатай хуудас</label><input id="feedbackPage" type="number" min="1" max="10000" placeholder="1"></div>
<label for="feedbackMessage">Тайлбар (10–1000 тэмдэгт)</label>
<textarea id="feedbackMessage" required minlength="10" maxlength="1000" rows="5" placeholder="Дэлгэрэнгүй бичнэ үү…"></textarea>
<button id="feedbackSubmit" type="submit" class="btn primary">Хүсэлт илгээх</button></form></section>
<section class="feature-section"><h2>Миний хүсэлтүүд</h2><div id="mySubmissions" class="feature-stack"></div>
<button id="refreshSubmissions" class="btn" type="button">↻ Шинэчлэх</button></section></main>
