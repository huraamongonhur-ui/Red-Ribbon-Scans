name: Repository security checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    name: static-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Parse standalone JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          for file in ./*.js ./api/*.mjs; do
            if [[ -f "$file" ]]; then
              node --check "$file"
            fi
          done

      - name: Run existing site regression tests
        run: node --test tests/site-smoke.cjs

      - name: Catch common accidentally committed secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          raw = subprocess.check_output(['git', 'ls-files', '-z'])
          paths = [
              pathlib.Path(item.decode('utf-8', errors='surrogateescape'))
              for item in raw.split(b'\0') if item
          ]
          blocked_names = {'id_rsa', 'id_ed25519', 'credentials.json'}
          risky_extensions = {'.pem', '.p12', '.pfx', '.key'}
          text_extensions = {
              '.js', '.mjs', '.cjs', '.json', '.html', '.css',
              '.py', '.sql', '.yml', '.yaml', '.md', '.txt', '.sh',
          }
          signatures = (
              re.compile(r'sb_secret_[A-Za-z0-9_-]{16,}'),
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'),
              re.compile(r'\b(?:ghp_|github_pat_)[A-Za-z0-9_]{25,}'),
          )
          failed = []
          for path in paths:
              if not path.is_file():
                  continue
              name = path.name.lower()
              if (name in blocked_names
                  or name == '.env'
                  or (name.startswith('.env.') and name not in {'.env.example', '.env.sample'})
                  or '.vercel' in path.parts
                  or path.suffix.lower() in risky_extensions):
                  failed.append(f'{path}: secret-like file must not be tracked')
                  continue
              if path.suffix.lower() not in text_extensions or path.stat().st_size > 1000000:
                  continue
              content = path.read_text(encoding='utf-8', errors='replace')
              if any(pattern.search(content) for pattern in signatures):
                  failed.append(f'{path}: possible embedded credential (value hidden)')
          if failed:
              print('\n'.join(failed), file=sys.stderr)
              sys.exit(1)
          print('Basic tracked-file secret checks passed (not a full secret scan).')
          PY
